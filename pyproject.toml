[project]
name = "mcp-login-proxy"
version = "0.3.0"
description = "OAuth login front for MCP servers, configured per deployment"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "mcp-login-oauth",
    "httpx>=0.28",
    "uvicorn>=0.30",
    "pyyaml>=6.0.3",
    "argon2-cffi>=25.1.0",
    "pydantic>=2.14.1",
]

[project.scripts]
mcp-login-proxy = "mcp_login_proxy.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_login_proxy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
mcp-login-oauth = { git = "https://github.com/Marceltov/mcp-login-oauth", rev = "oidc-login" }
